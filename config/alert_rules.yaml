alerts:
  # Alert 1: High Latency - triệu chứng người dùng phản ánh API chậm
  - name: High Latency P95
    severity: warning
    condition: "p95_latency_ms > 3000 for 5 minutes"
    type: symptom-based
    sli: latency_p95_ms
    slo: "99.5% requests under 3000ms"
    owner: sre-team
    runbook: docs/alerts.md#alert-1

  # Alert 2: Error Rate Spike - người dùng nhận được lỗi
  - name: High Error Rate
    severity: critical
    condition: "error_rate_pct > 2 for 2 minutes"
    type: symptom-based
    sli: error_rate_pct
    slo: "99.0% successful requests"
    owner: sre-team
    runbook: docs/alerts.md#alert-2

  # Alert 3: Cost Spike - chi phí vượt ngân sách dự kiến
  - name: Cost Budget Exceeded
    severity: warning
    condition: "cost_per_hour > 2.5 for 10 minutes"
    type: symptom-based
    sli: daily_cost_usd
    slo: "Under $2.50 per day"
    owner: platform-team
    runbook: docs/alerts.md#alert-3

  # Alert 4: Low Quality - chất lượng response không đạt kỳ vọng
  - name: Low Quality Score
    severity: warning
    condition: "quality_score_avg < 0.75 for 5 minutes"
    type: symptom-based
    sli: quality_score_avg
    slo: "95% requests with quality >= 0.75"
    owner: ml-team
    runbook: docs/alerts.md#alert-4
